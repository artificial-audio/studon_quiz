[project]
name = "qticonverter"
version = "0.1.0"
description = ""
authors = [
    {name = "Bharadwaj",email = "bharadwaj.l.suresh@fau.de"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "click (>=8.3.1,<9.0.0)",
    "mistune (>=3.1.4,<4.0.0)",
    "qti-package-maker (>=0.8.6,<0.9.0)",
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.poetry.scripts]
qticonverter = "qticonverter.CLI:cli"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)"
]
